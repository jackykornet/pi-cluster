apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.35.0

          envFrom:
            - configMapRef:
               name: audiobookshelf-configmap

          volumeMounts:
            - name: config
              mountPath: /etc/audiobookshelf/config
            - name: metadata
              mountPath: /etc/audiobookshelf/metadata
            - name: audiobooks
              mountPath: /etc/audiobookshelf/audiobooks
            - name: podcasts
              mountPath: /etc/audiobookshelf/podcasts

      volumes:
        - name: audiobookshelf-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
